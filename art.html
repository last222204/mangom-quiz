<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>망곰반 미술 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen tablet app, paper card on a sky-blue desk, three screens swapped in place */
:root{
  --desk:#dcefff; --paper:#f6fbfd; --ink:#2b2b33; --soft:#6b7385;
  --pink:#ff7aa8; --yellow:#ffd23f; --paw:#5aa9f0; --green:#2fa35b; --red:#e5484d;
  --line:#ffc3d6;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(circle at 20% 30%,#fff8 0 2px,transparent 3px),radial-gradient(circle at 70% 80%,#fff8 0 2px,transparent 3px);background-size:60px 60px}
*{box-sizing:border-box} [hidden]{display:none!important}
.card{max-width:980px;min-height:100%;margin:0 auto;background:var(--paper);border:2px solid var(--line);border-radius:22px;
  padding:18px;position:relative;display:flex;flex-direction:column}
.card::before{content:"";position:absolute;inset:8px;border:2px dashed #b9dcf3;border-radius:16px;pointer-events:none}
.deco{position:absolute;font-size:26px;line-height:1;pointer-events:none}
.deco.tl{top:20px;left:24px;color:var(--pink)} .deco.tl b{color:var(--yellow);margin-left:6px}
.deco.tr{top:20px;right:24px;color:var(--paw)}
.peek{position:absolute;right:28px;bottom:10px;width:96px;pointer-events:none}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:48px 8px 70px;position:relative;z-index:1}
h1{font-family:var(--display);font-weight:400;font-size:clamp(40px,8vw,76px);margin:0;text-align:center;text-wrap:balance;line-height:1.1;
  color:var(--ink);text-shadow:3px 3px 0 var(--yellow)}
h1 .m{color:var(--pink)}
.sub{color:var(--soft);margin:0;text-align:center;font-size:20px}
.intro{display:grid;grid-template-columns:1fr 1fr;gap:20px;width:100%;max-width:820px;align-items:center}
.wall{margin:0;position:relative;border:3px solid var(--ink);border-radius:20px;overflow:hidden;aspect-ratio:1684/1274;background:#fff}
.wall img{width:100%;height:100%;object-fit:cover;display:block;}
.wall figcaption{position:absolute;inset:auto 0 0 0;padding:14px 16px;background:linear-gradient(transparent,rgba(43,43,51,.82));color:#fff;font-family:var(--display);font-size:clamp(20px,2.6vw,26px);line-height:1.25}
.wall figcaption b{color:var(--yellow);font-weight:400}
.how{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:12px}
.how li{display:flex;gap:12px;align-items:center;background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 14px;font-size:19px;line-height:1.35}
.how li b{flex:none;width:36px;height:36px;border-radius:50%;background:var(--pink);color:#fff;display:grid;place-items:center;font-family:var(--display);font-weight:400;font-size:22px}
.how em{font-style:normal;font-family:var(--display);color:var(--pink);font-size:1.08em}
.gang{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;width:100%;max-width:380px}
#home{gap:16px;padding-top:40px;padding-bottom:56px}
#home h1{font-size:clamp(38px,7vw,64px)}
.gang figure{margin:0;text-align:center}
.gang img{width:100%;aspect-ratio:1;object-fit:contain;border-radius:14px;mix-blend-mode:multiply}
.gang figcaption{font-family:var(--display);font-size:17px}
.gang figure:nth-child(odd) img{animation:bob 2.4s ease-in-out infinite}
.gang figure:nth-child(even) img{animation:bob 2.4s ease-in-out -1.2s infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-2deg)}}
.btn{font-family:var(--display);font-size:30px;border:3px solid var(--ink);border-radius:999px;padding:14px 48px;background:var(--yellow);color:var(--ink);
  box-shadow:0 6px 0 var(--ink);cursor:pointer;touch-action:manipulation}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.step:focus-visible,.icon:focus-visible{outline:3px solid var(--paw);outline-offset:3px}
.btn.big{font-size:40px;padding:18px 72px}
.btn.pink{background:var(--pink);color:#fff}
.icon{position:absolute;left:22px;bottom:18px;z-index:2;border:0;background:none;font-size:15px;color:var(--soft);cursor:pointer;padding:8px;font-family:var(--body)}
/* quiz */
.timer{width:100%;max-width:820px;display:flex;align-items:center;gap:14px}
.bar{flex:1;height:22px;border:3px solid var(--ink);border-radius:999px;background:#fff;overflow:hidden}
.fill{height:100%;background:var(--green);width:100%;transition:width .25s linear,background .3s}
.secs{font-family:var(--display);font-size:44px;min-width:2.4ch;text-align:right;font-variant-numeric:tabular-nums}
.secs.hurry{color:var(--red);animation:pulse .5s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.15)}}
.ask{font-family:var(--display);font-size:clamp(26px,4vw,36px);margin:0;text-align:center}
.pair{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,440px));justify-content:center;gap:20px;width:100%;max-width:820px}
.q{background:#fff;border:3px solid var(--ink);border-radius:22px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:8px}
.q img{width:min(100%,220px);aspect-ratio:1;object-fit:contain;mix-blend-mode:multiply}
.q .name{font-family:var(--display);font-size:30px}
.counter{display:flex;align-items:center;gap:14px}
.step{width:72px;height:72px;border-radius:50%;border:3px solid var(--ink);font-family:var(--display);font-size:40px;line-height:1;cursor:pointer;touch-action:manipulation;color:var(--ink)}
.step.minus{background:#e9eef5} .step.plus{background:var(--pink);color:#fff}
.step:active{transform:scale(.92)}
.num{font-family:var(--display);font-size:64px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.q.ok{border-color:var(--green);box-shadow:0 0 0 4px var(--green) inset}
.q.no{border-color:var(--red);box-shadow:0 0 0 4px var(--red) inset}
.verdict{font-family:var(--display);font-size:24px}
.verdict.ok{color:var(--green)} .verdict.no{color:var(--red)}
.result-title{font-family:var(--display);font-size:clamp(44px,8vw,72px);margin:0;text-align:center}
.result-title.win{color:var(--pink);text-shadow:3px 3px 0 var(--yellow)}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
/* settings */
.panel{width:100%;max-width:560px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:22px;display:flex;flex-direction:column;gap:14px}
.panel h2{font-family:var(--display);font-weight:400;margin:0;font-size:30px}
.panel p{margin:0;color:var(--soft);font-size:16px}
.field{display:flex;align-items:center;justify-content:space-between;gap:12px;font-size:20px}
.field input{width:110px;font-size:24px;padding:8px 10px;border:2px solid var(--ink);border-radius:12px;text-align:center;font-family:var(--display);user-select:text;-webkit-user-select:text;background:var(--paper);color:var(--ink)}
@media (max-width:640px){
  .intro{grid-template-columns:1fr}
  .gang{grid-template-columns:repeat(2,1fr)}
  .pair{grid-template-columns:1fr}
  .q img{width:140px}
  .step{width:60px;height:60px}
  .peek{width:70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.back{align-self:flex-start;font-family:var(--body);font-size:16px;color:var(--soft);text-decoration:none;padding:6px 10px;border:2px solid currentColor;border-radius:999px;margin-top:-24px;margin-left:48px}
</style>

</head><body>

const CHARS=[
  {id:"rabbit",name:"토끼망곰"},{id:"fox",name:"여우망곰"},
  {id:"cat",name:"냥이망곰"},{id:"panda",name:"판다망곰"}];
const DEFAULTS={rabbit:17,fox:18,cat:20,panda:16,time:60};
let cfg={...DEFAULTS};
try{const s=JSON.parse(localStorage.getItem("mangom-cfg-v3")||"null");if(s)cfg={...cfg,...s}}catch(e){}

const $=id=>document.getElementById(id);
function updateHome(){$("howTime").textContent=cfg.time+"초";$("totalN").textContent=CHARS.reduce((s,c)=>s+(+cfg[c.id]||0),0)}
const screens=["home","quiz","result","settings"];
function show(id){screens.forEach(s=>$(s).hidden=s!==id);$("setBtn").hidden=id!=="home"}

$("gang").innerHTML=CHARS.map(c=>`<figure><img src="${IMG[c.id]}" alt="${c.name}"><figcaption>${c.name}</figcaption></figure>`).join("");

let picks=[],counts={},timer=null,endAt=0,done=false;

function start(){
  picks=[CHARS[Math.random()*CHARS.length|0]];
  counts={};picks.forEach(c=>counts[c.id]=0);done=false;
  $("ask").textContent=`부스 벽 그림 8장에서 ${picks[0].name}을 모두 찾아 세어 보세요!`;
  $("pair").innerHTML=picks.map(c=>`
    <div class="q"><img src="${IMG[c.id]}" alt=""><div class="name">${c.name}</div>
      <div class="counter">
        <button class="step minus" data-id="${c.id}" data-d="-1" aria-label="${c.name} 하나 빼기">−</button>
        <span class="num" id="n-${c.id}">0</span>
        <button class="step plus" data-id="${c.id}" data-d="1" aria-label="${c.name} 하나 더하기">+</button>
      </div></div>`).join("");
  show("quiz");
  const total=cfg.time*1000;endAt=Date.now()+total;
  tick();clearInterval(timer);timer=setInterval(tick,200);
  function tick(){
    const left=Math.max(0,endAt-Date.now()),sec=Math.ceil(left/1000);
    $("secs").textContent=sec;$("secs").classList.toggle("hurry",sec<=5&&sec>0);
    const f=$("fill");f.style.width=(left/total*100)+"%";
    f.style.background=left/total>.5?"var(--green)":left/total>.2?"var(--yellow)":"var(--red)";
    if(left<=0)finish(true);
  }
}
$("pair").addEventListener("click",e=>{
  const b=e.target.closest(".step");if(!b||done)return;
  const id=b.dataset.id;counts[id]=Math.max(0,Math.min(99,counts[id]+ +b.dataset.d));
  $("n-"+id).textContent=counts[id];
});
function finish(timeUp){
  if(done)return;done=true;clearInterval(timer);
  const res=picks.map(c=>({...c,guess:counts[c.id],ans:+cfg[c.id],ok:counts[c.id]===+cfg[c.id]}));
  const all=res.every(r=>r.ok),some=res.some(r=>r.ok);
  $("resTitle").textContent=all?"정답! 🎉":"아쉬워요!";
  $("resTitle").className="result-title"+(all?" win":"");
  $("resSub").textContent=timeUp?"시간 종료! 제출된 숫자로 채점했어요.":all?"망곰이 눈썰미 인정!":"부스를 다시 둘러보고 도전해 보세요.";
  $("resPair").innerHTML=res.map(r=>`
    <div class="q ${r.ok?"ok":"no"}"><img src="${IMG[r.id]}" alt=""><div class="name">${r.name}</div>
      <div class="verdict ${r.ok?"ok":"no"}">${r.ok?"정답 ⭕":"오답 ❌"} · 내 답 ${r.guess}</div>
      ${r.ok?"":`<div class="sub">정답은 ${r.ans}마리</div>`}</div>`).join("");
  show("result");
}
$("startBtn").onclick=start;
$("submitBtn").onclick=()=>finish(false);
$("againBtn").onclick=()=>show("home");

$("setFields").innerHTML=CHARS.map(c=>`<label class="field" for="set-${c.id}">${c.name}<input id="set-${c.id}" type="number" inputmode="numeric" min="0" max="99"></label>`).join("");
$("setBtn").onclick=()=>{CHARS.forEach(c=>$("set-"+c.id).value=cfg[c.id]);$("set-time").value=cfg.time;show("settings")};
$("closeSet").onclick=()=>show("home");
$("setForm").addEventListener("submit",e=>{
  e.preventDefault();
  CHARS.forEach(c=>cfg[c.id]=Math.max(0,parseInt($("set-"+c.id).value)||0));
  cfg.time=Math.min(300,Math.max(5,parseInt($("set-time").value)||30));
  try{localStorage.setItem("mangom-cfg-v3",JSON.stringify(cfg))}catch(err){}
  updateHome();
  show("home");
});
updateHome();
try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
</script>

</body></html>
