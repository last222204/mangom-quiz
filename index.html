<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>망곰반송 퀴즈</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Gowun+Dodum&display=swap">
<style>
/* Layout: one-screen tablet app, same paper card as the art quiz; lyrics sit on a five-line staff like the class song sheet */
:root{
  --desk:#e3f3e1; --paper:#fffdf6; --ink:#2b2b33; --soft:#6b7068;
  --pink:#ff7aa8; --yellow:#ffd23f; --sky:#5aa9f0; --violet:#a77be8; --green:#2fa35b; --red:#e5484d;
  --line:#ffd38a; --staff:#c9c4b8;
  --display:"Jua","Gowun Dodum",system-ui,sans-serif;
  --body:"Gowun Dodum",system-ui,sans-serif;
}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--body);font-size:18px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:16px;box-sizing:border-box;-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent}
*{box-sizing:border-box} [hidden]{display:none!important}
.card{max-width:980px;min-height:100%;margin:0 auto;background:var(--paper);border:2px solid var(--line);border-radius:22px;
  padding:18px;position:relative;display:flex;flex-direction:column;overflow:hidden}
.card::before{content:"";position:absolute;inset:8px;border:2px dashed #f2c46b;border-radius:16px;pointer-events:none}
.note{position:absolute;font-size:30px;line-height:1;pointer-events:none;opacity:.85}
.n1{top:22px;left:26px;color:var(--pink)} .n2{top:22px;right:26px;color:var(--violet)}
.n3{bottom:22px;left:26px;color:var(--sky)}
.peek{position:absolute;right:28px;bottom:10px;width:96px;pointer-events:none}
.screen{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;padding:48px 8px 70px;position:relative;z-index:1}
h1{font-family:var(--display);font-weight:400;font-size:clamp(44px,9vw,84px);margin:0;text-align:center;line-height:1.05;text-wrap:balance}
h1 span:nth-child(1){color:var(--pink)} h1 span:nth-child(2){color:#e8a800} h1 span:nth-child(3){color:var(--sky)} h1 span:nth-child(4){color:var(--violet)}
h1 span{text-shadow:0 4px 0 #fff,0 5px 0 var(--ink)}
.badge{font-family:var(--display);font-size:26px;background:#eaf5ff;border:2px dashed var(--sky);border-radius:999px;padding:6px 24px;color:#2f6fb5}
.badge b{color:var(--pink);font-weight:400}
.sub{color:var(--soft);margin:0;text-align:center;font-size:20px;text-wrap:balance}
.rules{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;margin:0;padding:0;list-style:none}
.rules li{background:#fff;border:2px solid var(--ink);border-radius:16px;padding:10px 16px;font-size:18px;display:flex;gap:8px;align-items:center}
.rules li b{font-family:var(--display);font-weight:400;font-size:22px;color:var(--pink)}
.gang{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;width:100%;max-width:640px}
.gang img{width:100%;aspect-ratio:1;object-fit:contain;mix-blend-mode:multiply;animation:hop 1s ease-in-out infinite}
.gang img:nth-child(2){animation-delay:.25s} .gang img:nth-child(3){animation-delay:.5s} .gang img:nth-child(4){animation-delay:.75s}
@keyframes hop{0%,100%{transform:translateY(0)}30%{transform:translateY(-10px) rotate(-3deg)}}
.btn{font-family:var(--display);font-size:30px;border:3px solid var(--ink);border-radius:999px;padding:14px 48px;background:var(--yellow);color:var(--ink);
  box-shadow:0 6px 0 var(--ink);cursor:pointer;touch-action:manipulation;text-decoration:none;display:inline-block;text-align:center}
.btn:active{transform:translateY(5px);box-shadow:0 1px 0 var(--ink)}
.btn:focus-visible,.opt:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.btn.big{font-size:40px;padding:18px 72px}
.btn.pink{background:var(--pink);color:#fff}
.btn.red{background:#ff4e45;color:#fff}
.btn[disabled]{opacity:.45;pointer-events:none}
/* listen */
.player{width:100%;max-width:760px;aspect-ratio:16/9;border:3px solid var(--ink);border-radius:18px;overflow:hidden;background:#000}
.player iframe{width:100%;height:100%;border:0;display:block}
.yt{display:flex;flex-direction:column;align-items:center;gap:14px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:28px 24px;max-width:560px;width:100%}
.yt .play{width:84px;height:60px;border-radius:16px;background:#ff4e45;position:relative}
.yt .play::after{content:"";position:absolute;left:34px;top:18px;border-left:22px solid #fff;border-top:12px solid transparent;border-bottom:12px solid transparent}
.small{font-size:16px;color:var(--soft);margin:0;text-align:center}
/* quiz */
.progress{display:flex;gap:10px;align-items:center;font-family:var(--display);font-size:22px}
.dot{width:22px;height:22px;border-radius:50%;border:3px solid var(--ink);background:#fff}
.dot.now{background:var(--yellow)} .dot.ok{background:var(--green)} .dot.no{background:var(--red)}
.verse{font-family:var(--display);font-size:20px;background:var(--yellow);border:2px solid var(--ink);border-radius:999px;padding:2px 14px}
.sheet{width:100%;max-width:860px;background:#fff;border:3px solid var(--ink);border-radius:22px;padding:22px 18px 18px}
.staff{height:56px;background:repeating-linear-gradient(to bottom,var(--staff) 0 2px,transparent 2px 12px);background-size:100% 50px;background-repeat:no-repeat;position:relative;margin:0 6px 10px}
.staff::before{content:"𝄞";position:absolute;left:-2px;top:-18px;font-size:64px;line-height:1;color:var(--ink)}
.staff .nt{position:absolute;width:13px;height:10px;border-radius:50%;background:var(--ink);transform:rotate(-20deg)}
.lyric{display:flex;flex-wrap:wrap;justify-content:center;gap:6px 4px;align-items:center}
.syl{font-family:var(--display);font-size:clamp(26px,4.2vw,40px);min-width:1.2em;text-align:center}
.gap{width:.6em}
.blank{font-family:var(--display);font-size:clamp(26px,4.2vw,40px);min-width:3.2em;padding:0 10px;border:3px dashed var(--pink);border-radius:14px;color:var(--pink);text-align:center;background:#fff2f7}
.blank.ok{border-style:solid;border-color:var(--green);color:var(--green);background:#eafaf0}
.blank.no{border-style:solid;border-color:var(--red);color:var(--red);background:#fff0f0}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:640px}
.opt{font-family:var(--display);font-size:32px;padding:16px;border:3px solid var(--ink);border-radius:18px;background:#fff;cursor:pointer;color:var(--ink);touch-action:manipulation;box-shadow:0 5px 0 var(--ink)}
.opt:nth-child(1){background:#ffe3ee} .opt:nth-child(2){background:#fff4c7} .opt:nth-child(3){background:#e2f1ff} .opt:nth-child(4){background:#efe5ff}
.opt:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink)}
.opt.ok{background:var(--green)!important;color:#fff} .opt.no{background:var(--red)!important;color:#fff}
.opt[disabled]{cursor:default}
.feedback{font-family:var(--display);font-size:30px;margin:0;min-height:1.2em}
.feedback.ok{color:var(--green)} .feedback.no{color:var(--red)}
.result-title{font-family:var(--display);font-size:clamp(48px,9vw,80px);margin:0;text-align:center}
.result-title.win{color:var(--pink);text-shadow:3px 3px 0 var(--yellow)}
.stamp{font-family:var(--display);font-size:26px;border:4px solid var(--pink);color:var(--pink);border-radius:50%;width:150px;height:150px;display:grid;place-items:center;text-align:center;transform:rotate(-12deg);line-height:1.15;background:#fff}
.review{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px;width:100%;max-width:640px}
.review li{display:flex;align-items:center;gap:12px;background:#fff;border:3px solid var(--ink);border-radius:16px;padding:10px 14px;font-family:var(--display);font-size:24px}
.review li.ok{border-color:var(--green)} .review li.no{border-color:var(--red)}
.review li span:nth-child(2){flex:1;min-width:0} .review li b{font-weight:400;color:var(--pink)}
.review .verse{font-size:16px}
.row{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
@media (max-width:640px){
  .opts{grid-template-columns:1fr}
  .opt{font-size:26px;padding:12px}
  .peek{width:70px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.player{position:relative}.player #yt{width:100%;height:100%}
.shield{position:absolute;inset:0;background:transparent}
.resume{position:absolute;inset:0;margin:auto;width:150px;height:150px;border-radius:50%;border:4px solid var(--ink);background:var(--pink);color:#fff;font-family:var(--display);font-size:28px;cursor:pointer;box-shadow:0 6px 0 var(--ink)}
.vmsg{font-size:18px;color:var(--soft);margin:0;text-align:center;min-height:1.3em;text-wrap:balance}
.vmsg.err{color:var(--red)}
</style>

</head><body>

  {v:"1절",before:"망곰반은 뭐든",answer:"잘해요",tb:1,after:"",wrong:["좋아요","알아요","먹어요"]},
  {v:"1절",before:"뭐든잘해요",answer:"정말잘해",after:"망곰반",wrong:["너무좋아","진짜멋져","최고최고"]},
  {v:"2절",before:"3학년 3반",answer:"노래",after:"가있어",ta:1,wrong:["친구","리코더","망곰이"]},
  {v:"2절",before:"망곰반 망곰반",answer:"똑똑",after:"반",ta:1,wrong:["씩씩","튼튼","행복"]},
  {v:"2절",before:"망곰반은",answer:"멋있어",after:"망곰반은 최고야",wrong:["귀여워","친절해","똑똑해"]},
  {v:"2절",before:"",answer:"으쓱으쓱",after:"멋있다",wrong:["반짝반짝","룰루랄라","쑥쑥쑥쑥"]}
];
const ROUND=3;
const $=id=>document.getElementById(id);
const screens=["home","listen","quiz","result"];
function show(id){screens.forEach(s=>$(s).hidden=s!==id)}
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const sylls=s=>[...s].map(ch=>ch===" "?'<span class="gap"></span>':`<span class="syl">${ch}</span>`).join("");

let qs=[],qi=0,results=[];

function drawStaff(){
  const st=$("staff");st.innerHTML="";
  for(let i=0;i<9;i++){const n=document.createElement("span");n.className="nt";
    n.style.left=(12+i*10)+"%";n.style.top=(3+((Math.random()*8)|0)*6)+"px";st.appendChild(n)}
}
function ask(){
  const q=qs[qi];
  $("dots").innerHTML=qs.map((_,i)=>`<span class="dot ${i<qi?results[i]?"ok":"no":i===qi?"now":""}"></span>`).join("")+`<span>${qi+1} / ${ROUND}</span>`;
  $("verse").textContent=q.v;
  $("lyric").innerHTML=sylls(q.before)+(q.before?'<span class="gap"></span>':"")+'<span class="blank" id="blank">?</span>'+(q.after?'<span class="gap"></span>'+sylls(q.after):"");
  $("opts").innerHTML=shuffle([q.answer,...q.wrong]).map(o=>`<button class="opt" data-o="${o}">${o}</button>`).join("");
  $("feedback").textContent="";$("feedback").className="feedback";
  drawStaff();show("quiz");
}
$("opts").addEventListener("click",e=>{
  const b=e.target.closest(".opt");if(!b||b.disabled)return;
  const q=qs[qi],ok=b.dataset.o===q.answer;
  document.querySelectorAll(".opt").forEach(x=>{x.disabled=true;if(x.dataset.o===q.answer)x.classList.add("ok")});
  if(!ok)b.classList.add("no");
  const bl=$("blank");bl.textContent=q.answer;bl.classList.add(ok?"ok":"no");
  $("feedback").textContent=ok?"딩동댕! 정답이에요":`땡! 정답은 "${q.answer}"${qi<ROUND-1?" · 다음 문제로 가요":""}`;
  $("feedback").className="feedback "+(ok?"ok":"no");
  results.push(ok);
  setTimeout(()=>{qi++; qi<ROUND?ask():finish(results.every(Boolean))},ok?1300:2200);
});
function finish(pass){
  $("stamp").hidden=!pass;
  $("resTitle").textContent=pass?"3문제 모두 정답!":"아쉬워요!";
  $("resTitle").className="result-title"+(pass?" win":"");
  $("resSub").textContent=pass?"망곰반송을 완벽하게 들었네요. 통과 도장 꽝!":`${ROUND}문제 중 ${results.filter(Boolean).length}문제 맞혔어요. ${ROUND}문제 모두 맞혀야 통과예요.`;
  $("review").innerHTML=qs.map((q,i)=>`<li class="${results[i]?"ok":"no"}"><span class="mk">${results[i]?"⭕":"❌"}</span><span>${q.before}${q.tb?"":" "}<b>${q.answer}</b>${q.ta?"":" "}${q.after}</span><span class="verse">${q.v}</span></li>`).join("");
  show("result");
}
let player=null,apiReady=false,ended=false,loadTimer=null;
const tag=document.createElement("script");tag.src="https://www.youtube.com/iframe_api";document.head.appendChild(tag);
window.onYouTubeIframeAPIReady=()=>{apiReady=true};
function setReady(on){const r=$("readyBtn");r.disabled=!on;r.textContent=on?"다 들었어요! 문제 풀기":"먼저 노래를 끝까지 들어 주세요"}
function msg(s,err){$("vmsg").textContent=s;$("vmsg").className="vmsg"+(err?" err":"")}
function showFallback(){$("fallback").hidden=false;msg("영상을 불러오지 못했어요. 아래 링크로 유튜브에서 들어 주세요.",true)}
function buildPlayer(){
  player=new YT.Player("yt",{videoId:"nTIIPxHjxZs",playerVars:{controls:0,disablekb:1,rel:0,playsinline:1,fs:0,iv_load_policy:3},
    events:{onStateChange:e=>{
      if(e.data===YT.PlayerState.PLAYING){$("shield").hidden=false;$("resume").hidden=true;msg("잘 들어 보세요! 🎵")}
      else if(e.data===YT.PlayerState.PAUSED&&!ended){$("resume").hidden=false}
      else if(e.data===YT.PlayerState.ENDED){ended=true;$("resume").hidden=true;setReady(true);msg("노래 끝! 이제 문제를 풀어요.")}
    },onError:showFallback}});
}
function resetListen(){
  ended=false;setReady(false);$("fallback").hidden=true;$("shield").hidden=true;$("resume").hidden=true;
  msg("영상 가운데 ▶ 버튼을 눌러 노래를 들어요. 끝까지 들어야 문제를 풀 수 있어요.");
  if(player&&player.seekTo){try{player.stopVideo();player.seekTo(0,false);player.pauseVideo()}catch(e){}return}
  clearInterval(loadTimer);let tries=0;
  loadTimer=setInterval(()=>{if(apiReady){clearInterval(loadTimer);buildPlayer()}else if(++tries>40){clearInterval(loadTimer);showFallback()}},250);
}
function stopVideo(){try{player&&player.stopVideo()}catch(e){}}
$("resume").onclick=()=>{try{player.playVideo()}catch(e){}};
$("ytLink").addEventListener("click",()=>setTimeout(()=>setReady(true),3000));
$("startBtn").onclick=()=>{resetListen();show("listen")};
$("readyBtn").onclick=()=>{stopVideo();qs=shuffle(BANK).slice(0,ROUND);qi=0;results=[];ask()};
$("againBtn").onclick=()=>show("home");
try{navigator.wakeLock&&navigator.wakeLock.request("screen").catch(()=>{})}catch(e){}
</script>
